<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>git-retail</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
      padding: 2rem;
    }

    h1 {
      font-size: 1.8rem;
      color: #e6edf3;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      color: #8b949e;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      max-width: 680px;
    }

    .card h2 {
      font-size: 1.1rem;
      color: #e6edf3;
      margin-bottom: 1rem;
    }

    .form-row {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    input[type="text"] {
      flex: 1;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      padding: 0.5rem 0.75rem;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #58a6ff;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
      font-weight: 500;
      transition: opacity 0.15s;
    }

    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-primary { background: #238636; color: #fff; }
    .btn-danger  { background: #da3633; color: #fff; padding: 0.35rem 0.75rem; font-size: 0.82rem; }
    .btn-warning { background: #9e6a03; color: #fff; padding: 0.35rem 0.75rem; font-size: 0.82rem; }

    #repos-list {
      list-style: none;
    }

    #repos-list li {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.6rem 0;
      border-bottom: 1px solid #21262d;
    }

    #repos-list li:last-child { border-bottom: none; }

    .repo-name {
      flex: 1;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 0.95rem;
      color: #58a6ff;
    }

    .repo-url {
      font-size: 0.78rem;
      color: #8b949e;
      font-family: monospace;
    }

    .rename-form {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .rename-form input {
      width: 160px;
    }

    .empty {
      color: #8b949e;
      font-style: italic;
      padding: 0.5rem 0;
    }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: #238636;
      color: #fff;
      padding: 0.75rem 1.25rem;
      border-radius: 6px;
      font-size: 0.9rem;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      max-width: 320px;
    }

    .toast.error { background: #da3633; }
    .toast.show  { opacity: 1; }
  </style>
</head>
<body>
  <h1>🛒 git-retail</h1>
  <p class="subtitle">Bare repository manager via <code>git-retailer</code> SSH host</p>

  <div class="card">
    <h2>Create Repository</h2>
    <div class="form-row">
      <input type="text" id="new-repo-name" placeholder="repository-name" autocomplete="off" />
      <button class="btn-primary" id="create-btn" onclick="createRepo()">Create</button>
    </div>
  </div>

  <div class="card">
    <h2>Repositories</h2>
    <ul id="repos-list">
      <li><span class="empty">Loading…</span></li>
    </ul>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const SSH_HOST = 'git-retailer';

    function showToast(msg, isError = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast' + (isError ? ' error' : '') + ' show';
      setTimeout(() => { t.className = 'toast' + (isError ? ' error' : ''); }, 3000);
    }

    async function loadRepos() {
      const list = document.getElementById('repos-list');
      try {
        const res = await fetch('/api/repos');
        const json = await res.json();
        if (!json.success) throw new Error(json.error);
        const repos = json.data;
        if (repos.length === 0) {
          list.innerHTML = '<li><span class="empty">No repositories yet.</span></li>';
          return;
        }
        list.innerHTML = repos.map(name => `
          <li id="repo-${CSS.escape(name)}">
            <span class="repo-name">${escHtml(name)}.git</span>
            <span class="repo-url">${SSH_HOST}:repos/${escHtml(name)}.git</span>
            <div class="rename-form">
              <input type="text" placeholder="new name" class="rename-input" data-repo="${escHtml(name)}" value="${escHtml(name)}" />
              <button class="btn-warning" onclick="renameRepo('${escJs(name)}')">Rename</button>
            </div>
            <button class="btn-danger" onclick="deleteRepo('${escJs(name)}')">Delete</button>
          </li>
        `).join('');
      } catch (e) {
        list.innerHTML = `<li><span class="empty">Error: ${escHtml(String(e))}</span></li>`;
      }
    }

    async function createRepo() {
      const input = document.getElementById('new-repo-name');
      const name = input.value.trim();
      if (!name) { showToast('Please enter a repository name.', true); return; }
      const btn = document.getElementById('create-btn');
      btn.disabled = true;
      try {
        const res = await fetch('/api/repos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name }),
        });
        const json = await res.json();
        if (!json.success) throw new Error(json.error);
        showToast(`Created ${name}.git`);
        input.value = '';
        await loadRepos();
      } catch (e) {
        showToast(String(e), true);
      } finally {
        btn.disabled = false;
      }
    }

    async function deleteRepo(name) {
      if (!confirm(`Delete ${name}.git? This cannot be undone.`)) return;
      try {
        const res = await fetch(`/api/repos/${encodeURIComponent(name)}`, { method: 'DELETE' });
        const json = await res.json();
        if (!json.success) throw new Error(json.error);
        showToast(`Deleted ${name}.git`);
        await loadRepos();
      } catch (e) {
        showToast(String(e), true);
      }
    }

    async function renameRepo(oldName) {
      const li = document.getElementById(`repo-${CSS.escape(oldName)}`);
      const input = li ? li.querySelector('.rename-input') : null;
      const newName = input.value.trim();
      if (!newName || newName === oldName) { showToast('Please enter a different name.', true); return; }
      try {
        const res = await fetch(`/api/repos/${encodeURIComponent(oldName)}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ new_name: newName }),
        });
        const json = await res.json();
        if (!json.success) throw new Error(json.error);
        showToast(`Renamed to ${newName}.git`);
        await loadRepos();
      } catch (e) {
        showToast(String(e), true);
      }
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
              .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function escJs(s) {
      return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    }

    document.getElementById('new-repo-name').addEventListener('keydown', e => {
      if (e.key === 'Enter') createRepo();
    });

    loadRepos();
  </script>
</body>
</html>
